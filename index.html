<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smooth Neural Bus Switcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030712;
      color: #00f0ff;
      font-family: monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.7);
      padding: 16px 20px;
      border-left: 3px solid #38bdf8;
      backdrop-filter: blur(8px);
      border-radius: 0 8px 8px 0;
    }
    .hud h1 {
      font-size: 0.95rem;
      letter-spacing: 2px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .hud-text {
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.5;
    }
    .hud-text span {
      color: #a855f7;
      font-weight: bold;
    }
    .hud-text span.cyan {
      color: #38bdf8;
    }
    .controls {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      padding: 10px 24px;
      border-radius: 30px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: 0.8rem;
      backdrop-filter: blur(8px);
    }
    .controls label {
      color: #94a3b8;
    }
    input[type="range"] {
      accent-color: #38bdf8;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <h1>SMOOTH_BUS_ROUTER // V5.0</h1>
    <div class="hud-text">
      BUS_DYNAMICS: <span class="cyan">CONTINUOUS_GLIDE</span><br />
      ACTIVE_BUSES: <span id="bus-cnt">0</span><br />
      MORPH_RATE: <span id="morph-rate">0.05</span>
    </div>
  </div>

  <div class="controls">
    <div>
      <label for="slideSpeed">SWITCH SPEED:</label>
      <input type="range" id="slideSpeed" min="1" max="10" value="5" />
    </div>
    <div>
      <label for="colCount">BAR COLUMNS:</label>
      <input type="range" id="colCount" min="4" max="16" value="8" />
    </div>
  </div>

  <canvas id="neuralCanvas"></canvas>

  <script>
    const canvas = document.getElementById('neuralCanvas');
    const ctx = canvas.getContext('2d');

    const busCntEl = document.getElementById('bus-cnt');
    const slideSpeedInput = document.getElementById('slideSpeed');
    const colCountInput = document.getElementById('colCount');

    let width, height;
    let columns = [];
    let buses = [];

    // Helper: Linear Interpolation for smooth motion
    function lerp(start, end, amt) {
      return (1 - amt) * start + amt * end;
    }

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initGraph();
    }

    class BarColumn {
      constructor(x, id) {
        this.x = x;
        this.id = id;
        this.width = 10;
      }

      draw() {
        // Vertical track core
        ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
        ctx.fillRect(this.x - this.width / 2, 40, this.width, height - 80);

        // Subtle glowing side rails
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
        ctx.lineWidth = 1;
        ctx.strokeRect(this.x - this.width / 2, 40, this.width, height - 80);
      }
    }

    class SmoothConnectionBus {
      constructor(colA, colB) {
        this.colA = colA;
        this.colB = colB;

        const margin = 80;
        const availableH = height - margin * 2;

        // Start & Current Y positions
        this.yA = margin + Math.random() * availableH;
        this.yB = margin + Math.random() * availableH;

        // Target Y positions (where connections smoothly slide towards)
        this.targetYA = this.yA;
        this.targetYB = this.yB;

        this.packets = [];
        this.switchTimer = 0;
        this.switchInterval = 80 + Math.random() * 100;
      }

      update() {
        const speedMult = parseFloat(slideSpeedInput.value) * 0.005;

        // Smoothly glide Y endpoints towards target heights (Smooth Switching)
        this.yA = lerp(this.yA, this.targetYA, speedMult);
        this.yB = lerp(this.yB, this.targetYB, speedMult);

        // Trigger new target connection height periodically
        this.switchTimer++;
        if (this.switchTimer > this.switchInterval) {
          const margin = 80;
          const availableH = height - margin * 2;

          // Pick a new target height along the vertical bars (UP or DOWN)
          if (Math.random() > 0.5) {
            this.targetYA = margin + Math.random() * availableH;
          } else {
            this.targetYB = margin + Math.random() * availableH;
          }

          this.switchTimer = 0;
          this.switchInterval = 60 + Math.random() * 120;
        }

        // Spawn smooth data packets flowing along the dynamic curve
        if (Math.random() < 0.1) {
          this.packets.push({
            t: 0,
            speed: 0.01 + Math.random() * 0.02,
            dir: Math.random() > 0.5 ? 1 : -1 // UP/DOWN or Left/Right flow
          });
        }

        // Update packet positions
        for (let i = this.packets.length - 1; i >= 0; i--) {
          let p = this.packets[i];
          p.t += p.speed;
          if (p.t >= 1) {
            this.packets.splice(i, 1);
          }
        }
      }

      getBezierPoint(t) {
        // Compute position along a smooth S-curve between bar endpoints
        const p0 = { x: this.colA.x, y: this.yA };
        const p3 = { x: this.colB.x, y: this.yB };
        
        const midX = (p0.x + p3.x) / 2;
        const p1 = { x: midX, y: p0.y };
        const p2 = { x: midX, y: p3.y };

        const cx = 3 * (p1.x - p0.x);
        const bx = 3 * (p2.x - p1.x) - cx;
        const ax = p3.x - p0.x - cx - bx;

        const cy = 3 * (p1.y - p0.y);
        const by = 3 * (p2.y - p1.y) - cy;
        const ay = p3.y - p0.y - cy - by;

        const xt = ax * Math.pow(t, 3) + bx * Math.pow(t, 2) + cx * t + p0.x;
        const yt = ay * Math.pow(t, 3) + by * Math.pow(t, 2) + cy * t + p0.y;

        return { x: xt, y: yt };
      }

      draw() {
        const midX = (this.colA.x + this.colB.x) / 2;
        
        // Color shifts depending on whether the connection is currently angled UP or DOWN
        const isUpward = this.yB < this.yA;
        const busColor = isUpward ? 'rgba(168, 85, 247, ' : 'rgba(56, 189, 248, ';

        // Draw curved connection bridge
        ctx.beginPath();
        ctx.moveTo(this.colA.x, this.yA);
        ctx.bezierCurveTo(midX, this.yA, midX, this.yB, this.colB.x, this.yB);
        ctx.strokeStyle = busColor + '0.4)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw anchor nodes on vertical bars
        ctx.fillStyle = busColor + '1)';
        ctx.shadowBlur = 8;
        ctx.shadowColor = busColor + '1)';
        
        ctx.beginPath();
        ctx.arc(this.colA.x, this.yA, 4, 0, Math.PI * 2);
        ctx.arc(this.colB.x, this.yB, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Draw smooth data packet pulses traveling along the curve
        this.packets.forEach(p => {
          const pos = this.getBezierPoint(p.dir === 1 ? p.t : 1 - p.t);
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.shadowBlur = 10;
          ctx.shadowColor = busColor + '1)';
          ctx.fill();
          ctx.shadowBlur = 0;
        });
      }
    }

    function initGraph() {
      columns = [];
      buses = [];
      const numCols = parseInt(colCountInput.value);
      const spacing = width / (numCols + 1);

      for (let i = 0; i < numCols; i++) {
        columns.push(new BarColumn(spacing * (i + 1), i));
      }

      // Create continuous connection buses between adjacent vertical bar columns
      for (let i = 0; i < columns.length - 1; i++) {
        // Multiple connections per adjacent bar layer for complex switching
        buses.push(new SmoothConnectionBus(columns[i], columns[i + 1]));
        buses.push(new SmoothConnectionBus(columns[i], columns[i + 1]));
      }
    }

    function animate() {
      ctx.fillStyle = 'rgba(3, 7, 18, 0.25)';
      ctx.fillRect(0, 0, width, height);

      // Render vertical bars
      columns.forEach(col => col.draw());

      // Update and render smooth connection buses
      buses.forEach(bus => {
        bus.update();
        bus.draw();
      });

      busCntEl.innerText = buses.length;

      requestAnimationFrame(animate);
    }

    // Listeners
    window.addEventListener('resize', resize);
    colCountInput.addEventListener('input', initGraph);

    resize();
    animate();
  </script>
</body>
</html>
